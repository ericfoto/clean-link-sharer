<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clean Link Sharer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="head">
        <svg class="logo" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
          <rect width="24" height="24" rx="6.5" fill="var(--brand)" />
          <g fill="none" stroke="#fff" stroke-width="2" transform="rotate(-45 12 12)">
            <rect x="4" y="9.5" width="8.5" height="5" rx="2.5" />
            <rect x="11.5" y="9.5" width="8.5" height="5" rx="2.5" />
          </g>
          <path d="M18.2 3.2l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z" fill="#fff" />
        </svg>
        <h1 data-i18n="popupTitle">Clean Link Sharer</h1>
      </header>

      <div class="field">
        <label for="output" class="sr-only" data-i18n="popupTitle">Clean Link Sharer</label>
        <textarea id="output" readonly rows="2" spellcheck="false" autocomplete="off"></textarea>
      </div>

      <div class="actions">
        <button type="button" id="copy-btn" class="btn btn-primary" data-i18n="btnCopy">Copy</button>
        <button type="button" id="share-btn" class="btn" data-i18n="btnShare" hidden>Share</button>
        <button type="button" id="open-btn" class="btn" data-i18n="btnOpen">Open</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>

      <details id="removed-details" open hidden>
        <summary id="removed-summary"></summary>
        <ul id="removed-list"></ul>
        <p id="unwrapped-note" data-i18n="unwrappedNote" hidden>Redirect link unwrapped</p>
      </details>

      <footer class="foot">
        <button type="button" id="options-btn" class="link-btn" data-i18n="btnSettings">Settings</button>
      </footer>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
